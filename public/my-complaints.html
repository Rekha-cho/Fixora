<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Complaints</title>
<style>
body { font-family:'Segoe UI'; background:#f0f4f8; margin:0; }
nav { background:#1a569b; color:white; padding:15px 30px; display:flex; justify-content:space-between; }
nav a { color:white; text-decoration:none; background:#00b4d8; padding:6px 12px; border-radius:6px; margin-left:8px; }

.container { max-width:800px; margin:40px auto; }

.card {
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.badge {
    padding:3px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}
.pending { background:#fef3c7; color:#b45309; }
.progress { background:#dbeafe; color:#1d4ed8; }
.resolved { background:#d1fae5; color:#065f46; }
</style>
</head>

<body>

<nav>
    <h2>📋 My Complaints</h2>
    <div>
        <a href="index.html">Dashboard</a>
        <a href="profile.html">Profile</a>
    </div>
</nav>

<div class="container" id="list"></div>

<script>
const user = JSON.parse(localStorage.getItem('user'));
if (!user) window.location.href = 'login.html';

function getToken() {
    return user.token;
}

loadComplaints();

async function loadComplaints() {
    const res = await fetch('/api/complaints', {
        headers: { 'Authorization': 'Bearer ' + getToken() }
    });

    const data = await res.json();
    const div = document.getElementById('list');

    if (!data.length) {
        div.innerHTML = "<p>No complaints yet</p>";
        return;
    }

    div.innerHTML = data.map(c => `
        <div class="card">
            <h3>${c.title}</h3>
            <p>${c.description}</p>
            <p><b>Category:</b> ${c.category}</p>
            <span class="badge ${getClass(c.status)}">${c.status}</span>
        </div>
    `).join('');
}

function getClass(status){
    if(status==='Pending') return 'pending';
    if(status==='In Progress') return 'progress';
    if(status==='Resolved') return 'resolved';
}
</script>

</body>
</html>
