<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fixora - Profile</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background:#f0f4f8; margin:0; }
        nav { background:#1a569b; color:white; padding:15px 30px; display:flex; justify-content:space-between; }
        nav a { color:white; text-decoration:none; background:#00b4d8; padding:7px 14px; border-radius:6px; margin-left:8px; }
        .card { max-width:500px; margin:60px auto; background:white; padding:30px; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
        h2 { color:#1a569b; }
        p { font-size:16px; color:#334155; }
        button { width:100%; padding:12px; background:#e53e3e; color:white; border:none; border-radius:8px; cursor:pointer; margin-top:20px; }
    </style>
</head>
<body>

<nav>
    <h2>🎓 Fixora Profile</h2>
    <div>
        <a href="index.html">Dashboard</a>
        <a href="admin.html">Admin</a>
    </div>
</nav>

<div class="card">
    <h2>👤 My Profile</h2>
    <p><b>Name:</b> <span id="name"></span></p>
    <p><b>Role:</b> <span id="role"></span></p>
    <p><b>User ID:</b> <span id="id"></span></p>

    <button onclick="logout()">Logout</button>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user'));

if (!user) {
    window.location.href = 'login.html';
}

document.getElementById('name').textContent = user.name;
document.getElementById('role').textContent = user.role;
document.getElementById('id').textContent = user.id;

function logout() {
    localStorage.removeItem('user');
    window.location.href = 'login.html';
}
</script>

</body>
</html>
